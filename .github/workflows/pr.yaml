name: pr

on:
  # edited is not a default type, so a corrected PR title would otherwise never
  # re-run the check that rejected it. Only the commits job reacts to it; the
  # rest guard on the action, since a title change touches no code.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A title correction raises "edited", which must not cancel the code checks
# already running for the same ref: those jobs skip on "edited", so the cancelled
# run would be replaced by one reporting success having tested nothing. Title and
# code therefore cancel only their own kind.
concurrency:
  group: pr-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'code' }}
  cancel-in-progress: true

# Without this, a bare "run:" step gets "bash -e {0}" — no pipefail, so a
# failure earlier in a pipe (e.g. inside a process substitution) is swallowed.
defaults:
  run:
    shell: bash

jobs:
  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          pattern='^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([a-z0-9._-]+\))?!?: .{1,72}$'
          # A failure inside the process substitution below cannot reach the exit
          # status, so an unreadable range would pass the gate having checked nothing.
          git rev-list "$base..$head" >/dev/null
          failed=0
          while IFS='|' read -r author line; do
            case "$line" in "Merge "*|"Revert "*) continue ;; esac
            # Dependabot subjects can carry a pseudo-versioned module past 72
            # characters, and the bot's own commit cannot be hand-edited.
            [ "$author" = "dependabot[bot]" ] && continue
            if ! printf '%s' "$line" | grep -Eq "$pattern"; then
              echo "::error::not a Conventional Commit: $line"
              failed=1
            fi
          done < <(git log --format='%an|%s' "$base..$head")
          exit $failed
      - name: Check pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([a-z0-9._-]+\))?!?: .{1,72}$'
          printf '%s' "$TITLE" | grep -Eq "$pattern" \
            || { echo "::error::PR title is not a Conventional Commit: $TITLE"; exit 1; }

  check:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Install chart tooling
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - run: just check

  verify:
    # Regenerates RBAC from the markers and fails if the chart is out of date.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just verify

  test:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just test

  govulncheck:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
      - run: just e2e
      - name: Dump controller and fake logs on failure
        if: failure()
        run: |
          kubectl --context k3d-pangolin-gateway -n pangolin-gateway-system \
            logs -l app.kubernetes.io/name=pangolin-gateway --tail=200 || true
          kubectl --context k3d-pangolin-gateway -n pangolin-gateway-system \
            logs -l app.kubernetes.io/name=pangolin-fake --tail=200 || true
          kubectl --context k3d-pangolin-gateway -n pangolin-gateway-system \
            describe pods || true

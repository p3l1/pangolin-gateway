# A route that also lets two addresses in by e-mail code. Works on any Pangolin
# build; domain wildcards need a ResourcePolicy instead.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: demo
  annotations:
    pangolin.p3l1.de/email-whitelist: "anna@example.com, bob@example.org"
spec:
  parentRefs:
    - name: pangolin
  hostnames:
    - demo.example.com
  rules:
    - backendRefs:
        - name: web
          port: 8080

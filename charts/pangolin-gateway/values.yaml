image:
  repository: ghcr.io/p3l1/pangolin-gateway
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

pangolin:
  # Integration API base URL INCLUDING its version path. Pangolin Cloud serves
  # /v1, self-hosted usually /api/v1 — point this at the Integration API, not at
  # the internal API, or every call comes back as an opaque 401.
  endpoint: ""
  # Organisation id.
  org: ""
  # Site niceId for routes without the pangolin.p3l1.de/site annotation. Required.
  defaultSite: ""
  # The integration key, of the form <key_id>.<key_secret>. Supply it yourself;
  # this chart never creates a secret. The key needs three API actions:
  # applyBlueprint, listResources and deleteResource; publishing private
  # resources also needs listSiteResources and deleteSiteResource. listSites,
  # listClients and listUsers let names be checked before the apply. With
  # pangolin.licensed the key also needs listResourcePolicies and
  # deleteResourcePolicy.
  apiKeySecret:
    name: ""
    key: apiKey
  # The Pangolin organisation holds a licence for shared resource policies. Turns
  # on ResourcePolicy objects and the pangolin.p3l1.de/policy annotation; off, the
  # controller never calls the policy API and refuses both.
  licensed: false
  # Log every write instead of performing it.
  dryRun: false
  # How often to reconcile without a cluster event, repairing drift Pangolin-side.
  resyncInterval: 5m

crds:
  # Install the PrivateResource and ResourcePolicy CRDs. The controller watches
  # them and does not start without them, so turn this off only when the CRD is installed some other way.
  install: true
  # Keep the CRDs when the release is uninstalled. Deleting them deletes every
  # PrivateResource and ResourcePolicy, and the next controller pass prunes them from Pangolin.
  keep: true

gatewayClass:
  # Install a GatewayClass alongside the controller.
  create: true
  name: pangolin

replicaCount: 1

leaderElection:
  enabled: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

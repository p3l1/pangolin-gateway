{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pangolin-gateway.fullname" . }}
  labels:
    {{- include "pangolin-gateway.labels" . | nindent 4 }}
rules:
  # BEGIN GENERATED — rewritten by `just generate` from config/rbac/role.yaml; do not edit by hand.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups:
    - ""
    resources:
    - events
    verbs:
    - create
    - patch
  - apiGroups:
    - ""
    resources:
    - secrets
    verbs:
    - create
    - get
  - apiGroups:
    - gateway.networking.k8s.io
    resources:
    - gatewayclasses
    - gateways
    - httproutes
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - gateway.networking.k8s.io
    resources:
    - gatewayclasses/status
    - gateways/status
    - httproutes/status
    verbs:
    - get
    - patch
    - update
  # END GENERATED
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pangolin-gateway.fullname" . }}
  labels:
    {{- include "pangolin-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pangolin-gateway.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pangolin-gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
